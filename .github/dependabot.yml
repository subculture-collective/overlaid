version: 2

# Green pull requests in this organization merge themselves and a merge to
# main deploys, so every ecosystem opens at most two pull requests, groups
# minor and patch updates into one, and leaves major versions to a person.
updates:
  - package-ecosystem: gomod
    directories:
      - /backend
      - /backend/spikes/river
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # River is pinned to the release its vendored migrations and fair-leasing
      # adapter derive from; see docs/vendor/river/PROVENANCE.md.
      - dependency-name: 'github.com/riverqueue/river*'

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directories:
      - /backend
      - /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # The Go minor version follows backend/go.mod.
      - dependency-name: golang
        update-types: ['version-update:semver-minor']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
