name: Mirror CI
run-name: Mirror CI ${{ github.sha }}
'on':
  push: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        phase:
        - application
        - race
        - qualification
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: |
          backend/go.sum
          backend/spikes/river/go.sum
        cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install declared pnpm version
      run: npm install --global pnpm@10.33.0
    - name: Verify selected phase
      env:
        VERIFY_PHASE: ${{ matrix.phase }}
      run: |
        bash scripts/ci-postgres.sh "$VERIFY_PHASE"
        git diff --exit-code
    if: github.repository == 'subculture-collective/overlaid'
  verify:
    needs: checks
    if: github.repository == 'subculture-collective/overlaid'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - name: Require all verification phases
      env:
        CHECKS_RESULT: ${{ needs.checks.result }}
      run: test "$CHECKS_RESULT" = success
  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/overlaid'
    needs:
    - checks
    - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every verification job
      env:
        RESULTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PY'
        import json, os
        results = json.loads(os.environ["RESULTS"])
        expected = {'checks', 'verify'}
        assert set(results) == expected, results
        for name, result in results.items():
            assert result["result"] == "success", name + " did not pass"
        PY
